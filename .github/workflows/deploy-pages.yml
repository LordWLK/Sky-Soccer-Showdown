# Publie le jeu sur la branche gh-pages à chaque push : GitHub Pages
# sert cette branche (méthode classique, sans appel à l'API Pages).
name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - claude/game-description-d44l9q
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le site statique
        run: |
          mkdir _site
          cp index.html style.css manifest.webmanifest sw.js logo.webp _site/
          cp icon-192.png icon-512.png apple-touch-icon.png _site/
          cp -r src vendor _site/
          touch _site/.nojekyll

      - name: Publier sur la branche gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Déploiement Pages : ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
